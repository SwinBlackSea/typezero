name: TypeZero
options:
  bundleIdPrefix: com.typezero
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  TypeZero:
    type: application
    platform: macOS
    sources:
      - path: TypeZero
        excludes:
          - Info.plist
          - TypeZero.entitlements
    info:
      path: TypeZero/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: TypeZero 需要使用麦克风录制语音并转换为文字。
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.typezero.mac
        PRODUCT_NAME: TypeZero
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: TypeZero/TypeZero.entitlements
        INFOPLIST_FILE: TypeZero/Info.plist
        INFOPLIST_KEY_NSMicrophoneUsageDescription: TypeZero 需要使用麦克风录制语音并转换为文字。
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
